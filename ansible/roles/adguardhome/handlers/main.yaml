---
- name: restart adguardhome
  service:
    name: adguardhome
    state: restarted
  become: yes

- name: restart systemd-resolved
  service:
    name: systemd-resolved
    state: restarted
  become: yes

- name: apply netplan
  command: netplan apply
  become: yes

- name: restart keepalived
  service:
    name: keepalived
    state: restarted
  become: yes

- name: reload keepalived
  service:
    name: keepalived
    state: reloaded
  become: yes
