---

- name: Install required system packages
  apt:
    name:
      - curl
    state: present
    update_cache: yes
  become: yes

- name: Check if AdGuard Home is already installed
  stat:
    path: /opt/AdGuardHome/AdGuardHome
  register: adguardhome_binary

- name: Install AdGuard Home using official script
  shell: curl -s -S -L https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/master/scripts/install.sh | sh -s -- -v
  args:
    creates: /opt/AdGuardHome/AdGuardHome
  become: yes
  when: not adguardhome_binary.stat.exists

- name: Configure systemd-resolved (disable DNS stub listener)
  block:
    - name: Create systemd-resolved config directory
      file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: '0755'
      become: yes

    - name: Disable resolved stub
      copy:
        src: files/resolved-adguardhome.conf
        dest: /etc/systemd/resolved.conf.d/adguardhome.conf
        owner: root
        mode: "0644"
      become: yes
      notify: restart systemd-resolved

    - name: Use resolved resolv.conf
      file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: yes
      become: yes
      notify: restart systemd-resolved
  when: disable_systemd_resolved | default(true)

- name: Enable and start AdGuard Home service
  systemd:
    name: AdGuardHome
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes

- name: Wait for AdGuard Home to be ready
  uri:
    url: "http://127.0.0.1:{{ adguardhome_http_port }}/control/status"
    status_code: 200
    timeout: 5
  register: result
  until: result.status == 200
  retries: 30
  delay: 5
  failed_when: false